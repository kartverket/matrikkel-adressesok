name: databricks-til-elastic - Build, push and deploy

on:
  push:
    paths:
      - "databricks-til-elastic/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/databricks-til-elastic-build-push-deploy.yaml"

env:
  CI: true
  TZ: UTC

concurrency:
  group: databricks-til-elastic-build-push-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: databricks-til-elastic

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}
      image: ${{ steps.version-string.outputs.image }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - name: Generate version string
        id: version-string
        shell: bash
        run: |
          version="$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/kartverket/matrikkel-adressesok/databricks-til-elastic:${version}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('databricks-til-elastic/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run compose:up
      - run: bun run test:integration
        env:
          ES_URL: http://localhost:9201
      - run: bun run compose:down
        if: always()

  build:
    runs-on: ubuntu-latest
    needs:
      - version
      - test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker image and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #7.4.0
        with:
          context: .
          file: databricks-til-elastic/Dockerfile
          push: true
          tags: ${{ needs.version.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pharos:
    name: Run Pharos
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          image_url: ${{ needs.version.outputs.image }}
          trivy: true
          tfsec: true
          disable_severity_check: true

  deploy-prodtest:
    name: Deploy to prodtest
    runs-on: ubuntu-latest
    needs:
      - version
      - pharos
      - build
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Deploy to prodtest
        uses: kartverket/matrikkel-actions/heimdall-deploy@main
        with:
          cluster: 'atkv3-prod'
          resource: 'databricks-til-elastic/.skip/prodtest.yaml'
          wait: false
          var: |
            image=${{ needs.version.outputs.image }}
  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - version
      - pharos
      - build
      - deploy-prodtest
    environment:
      name: production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Deploy to prod
        uses: kartverket/matrikkel-actions/heimdall-deploy@main
        with:
          cluster: 'atkv3-prod'
          resource: 'databricks-til-elastic/.skip/prod.yaml'
          wait: false
          var: |
            image=${{ needs.version.outputs.image }}
