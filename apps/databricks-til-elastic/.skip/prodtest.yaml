apiVersion: skiperator.kartverket.no/v1beta1
kind: SKIPJob
metadata:
  name: databricks-til-elastic
  namespace: matrikkel-prodtest
spec:
  cron:
    # Hver time. SKIP-jobber kjører i UTC med mindre timeZone er satt - se
    # dokumentasjonen.
    schedule: "0 * * * *"
  job:
    ttlSecondsAfterFinished: 3600
    activeDeadlineSeconds: 3600
  image: "{{image}}"
  resources:
    limits:
      memory: 1G
    requests:
      cpu: 100m
      memory: 512M
  accessPolicy:
    outbound:
      external:
        - host: matrikkelen-adrs-dev-cf782b.es.europe-north1.gcp.elastic-cloud.com
        - host: 3359340685875444.4.gcp.databricks.com
  env:
    - name: ENVIRONMENT
      value: "PRODTEST"
    - name: DATABRICKS_HOST
      value: "3359340685875444.4.gcp.databricks.com"
    - name: DATABRICKS_HTTP_PATH
      value: "/sql/1.0/warehouses/7b7b34fd5e55d6f1"
    - name: DATABRICKS_CLIENT_ID
      gsmSecretName: "databricks-to-elastic-databricks-client-id"
    - name: DATABRICKS_CLIENT_SECRET
      gsmSecretName: "databricks-to-elastic-databricks-client-secret"
    - name: DATABRICKS_TABLE
      value: "eiendom_matrikkelen-adresse.3_gold_schema.matrikkel_adressesok_produkt_gold"
    - name: ES_URL
      value: "https://matrikkelen-adrs-dev-cf782b.es.europe-north1.gcp.elastic-cloud.com"
    - name: ES_API_KEY
      gsmSecretName: "databricks-to-elastic-es-api-key"
    - name: TZ
      value: "UTC"
