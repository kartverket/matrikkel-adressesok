services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  # Brukes av apps/databricks-til-elastic (se tilhørende README). Annen
  # ES-versjon og port enn adressesok-tjenestens "elasticsearch" over, slik
  # at begge kan kjøre samtidig lokalt uten portkollisjon.
  elasticsearch-databricks-til-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: >-
        -Xms512m
        -Xmx512m
        -XX:TieredStopAtLevel=0
    ports: ["9201:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  elasticsearch-data:
